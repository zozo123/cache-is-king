name: Finish line v0.1.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finish-line-v0.1.0.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: finish-line-v0.1.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: |
          set -euo pipefail
          gofmt -w $(find . -name '*.go' -type f -print)
          git diff --exit-code
      - run: go vet ./... && go test -count=1 ./...
      - name: Package v0.1.0
        env:
          VERSION: v0.1.0
        run: .github/scripts/package.sh
      - name: Publish or repair release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git rev-parse v0.1.0 >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v0.1.0 -m "Cache Is King v0.1.0"
            git push origin v0.1.0
          fi
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 dist/* --clobber
          else
            gh release create v0.1.0 --title "Cache Is King v0.1.0" --generate-notes dist/*
          fi

  pages-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: [release, pages-deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Verify release, Pages, installer, and binary
        run: |
          set -euo pipefail
          site=https://zozo123.github.io/cache-is-king
          release=https://github.com/zozo123/cache-is-king/releases/download/v0.1.0

          for i in $(seq 1 36); do
            if curl -fsSL "$site/" | grep -q "Cache Is King" && curl -fsSL "$site/run" | grep -q "repo=zozo123/cache-is-king"; then
              break
            fi
            sleep 5
          done

          curl -fsSL "$site/" | grep -q "Cache Is King"
          curl -fsSL "$site/run" -o /tmp/cache-is-king-run
          grep -q "repo=zozo123/cache-is-king" /tmp/cache-is-king-run
          chmod +x /tmp/cache-is-king-run

          curl -fsSL "$release/checksums.txt" -o /tmp/checksums.txt
          for asset in \
            cache-is-king_linux_amd64.tar.gz \
            cache-is-king_linux_arm64.tar.gz \
            cache-is-king_darwin_amd64.tar.gz \
            cache-is-king_darwin_arm64.tar.gz; do
            grep -q " $asset$" /tmp/checksums.txt
            curl -fsSIL "$release/$asset" >/dev/null
          done

          env PATH=/usr/bin:/bin CACHE_IS_KING_VERSION=v0.1.0 /tmp/cache-is-king-run version | grep -q '^v0.1.0$'
          env PATH=/usr/bin:/bin CACHE_IS_KING_VERSION=v0.1.0 /tmp/cache-is-king-run env
          env PATH=/usr/bin:/bin CACHE_IS_KING_VERSION=v0.1.0 /tmp/cache-is-king-run doctor --strict .
      - name: Commit publication receipt
        run: |
          set -euo pipefail
          mkdir -p .release
          cat > .release/v0.1.0 <<EOF
          release=v0.1.0
          release_url=https://github.com/zozo123/cache-is-king/releases/tag/v0.1.0
          pages=https://zozo123.github.io/cache-is-king/
          installer=https://zozo123.github.io/cache-is-king/run
          status=verified
          verified_commit=$GITHUB_SHA
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release/v0.1.0
          git commit -m "Record verified v0.1.0 publication" || exit 0
          git push origin HEAD:main
